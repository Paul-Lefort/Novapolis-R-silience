
services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      dfs:
        condition: service_started
      bfs:
        condition: service_started
      dijkstra:
        condition: service_started
      bellman_ford:
        condition: service_started
      floyd_warshall:
        condition: service_started
      kruskal:
        condition: service_started
      prim:
        condition: service_started
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: mysql:8.0
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  dfs:
    build: ./microservices/dfs
    restart: unless-stopped

  bfs:
    build: ./microservices/bfs
    restart: unless-stopped

  dijkstra:
    build: ./microservices/dijkstra
    restart: unless-stopped

  bellman_ford:
    build: ./microservices/bellman_ford
    restart: unless-stopped

  floyd_warshall:
    build: ./microservices/floyd_warshall
    restart: unless-stopped

  kruskal:
    build: ./microservices/kruskal
    restart: unless-stopped

  prim:
    build: ./microservices/prim
    restart: unless-stopped

volumes:
  db_data:
