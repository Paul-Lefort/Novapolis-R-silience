<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>

    <!-- CSS Personnalisé -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="app-layout">

    <!-- Barre de navigation supérieure -->
    <nav class="google-nav">
        <div class="nav-left">
            <button class="menu-toggle-btn" onclick="toggleSidebar()" title="Réduire / Ouvrir le menu">☰</button>
            <a href="/" class="google-nav-brand">
                <span style="color: #4285F4;">N</span><span style="color: #EA4335;">o</span><span style="color: #FBBC05;">v</span><span style="color: #4285F4;">a</span><span style="color: #34A853;">p</span><span style="color: #EA4335;">o</span><span style="color: #FBBC05;">l</span><span style="color: #4285F4;">i</span><span style="color: #34A853;">s</span>
            </a>
        </div>
        <div class="nav-right">
            <button class="google-nav-btn" onclick="openModal()">⚙️ Générer un jeu de données</button>
        </div>
    </nav>

    <!-- Conteneur principal (Sidebar + Carte) -->
    <div class="app-container">
        <!-- Menu latéral rétractable -->
        <aside id="sidebar" class="sidebar">
            <!-- Contenu normal (quand le menu est ouvert) -->
            <div class="sidebar-content">
                <div class="sidebar-section">
                    <h3>🗺️ Vues du Réseau</h3>
                    <div class="view-switch-col">
                        <button class="view-btn active" id="btn-routier" onclick="switchView('routier')">🛣️ Réseau Routier</button>
                        <button class="view-btn" id="btn-fibre" onclick="switchView('fibre')">🌐 Réseau Fibre Optique</button>
                    </div>
                </div>

                <hr class="sidebar-divider">

                <div class="sidebar-section">
                    <h3>🚀 Algorithmes</h3>
                    <div class="algo-control-group">
                        <select id="algo-select" class="sidebar-select" onchange="onAlgoChange()">
                            <option value="dijkstra">Dijkstra (Plus court chemin)</option>
                            <option value="bellman_ford">Bellman-Ford</option>
                            <option value="bfs">BFS (Largeur)</option>
                            <option value="dfs">DFS (Profondeur)</option>
                            <option value="floyd_warshall">Floyd-Warshall</option>
                            <option value="kruskal">Kruskal (MST)</option>
                            <option value="prim">Prim (MST)</option>
                        </select>

                        <!-- Statut de sélection sur la carte -->
                        <div class="selection-status">
                            <div>🚗 Départ : <span id="label-start">Aucun</span></div>
                            <div id="target-container" style="margin-top: 4px;">🏁 Arrivée : <span id="label-target">Aucun</span></div>
                        </div>

                        <button class="sidebar-action-btn" onclick="runSelectedAlgorithm()">🚀 Lancer l'algorithme</button>
                    </div>
                </div>

                <hr class="sidebar-divider">

                <!-- ==================== MENU BURGER : EXPORT & IMPORT ==================== -->
                <div class="sidebar-section">
                    <h3>📤 Export des Données</h3>
                    <button onclick="downloadZipArchive()" style="width: 100%; padding: 8px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; margin-bottom: 8px;">
                        📦 Télécharger le ZIP complet
                    </button>
                    <div style="display: flex; gap: 5px;">
                        <button onclick="downloadSingle('sites.csv')" style="flex: 1; padding: 6px; background: #5f6368; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Sites</button>
                        <button onclick="downloadSingle('routes.csv')" style="flex: 1; padding: 6px; background: #5f6368; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Routes</button>
                        <button onclick="downloadSingle('fibre.csv')" style="flex: 1; padding: 6px; background: #5f6368; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Fibre</button>
                    </div>
                </div>

                <div class="sidebar-section" style="margin-top: 15px;">
                    <h3>📥 Import de Fichiers</h3>
                    <!-- Input fichier caché -->
                    <input type="file" id="import-file-input" accept=".csv" style="display: none;" onchange="handleFileImport(event)">
                    <button onclick="document.getElementById('import-file-input').click()" style="width: 100%; padding: 8px; background: #34a853; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">
                        📂 Importer un CSV
                    </button>
                    <span id="import-status" style="font-size: 11px; display: block; margin-top: 6px; color: #666; word-break: break-all;">Aucun fichier choisi</span>
                </div>

                <hr class="sidebar-divider">

                <div class="sidebar-section">
                    <h3>📊 Statistiques</h3>
                    <div id="stats-info" style="font-size: 13px; color: #5f6368;">Chargement...</div>
                </div>
            </div>

            <!-- Icônes raccourcies (quand le menu est replié) -->
            <div class="sidebar-icons-collapsed">
                <button class="icon-collapsed-btn" onclick="toggleSidebar()" title="Vues / Imports">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                </button>
                <button class="icon-collapsed-btn" onclick="toggleSidebar()" title="Algorithmes (Git Branch)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
                </button>
            </div>
        </aside>

        <!-- Zone principale de la carte -->
        <main class="map-main-content">
            <div id="loading-overlay">
                <div class="spinner"></div>
                <div class="loading-text" id="loading-msg">Chargement de la carte...</div>
            </div>
            <div id="network-container"></div>
        </main>
    </div>

    <!-- Modale de génération -->
    <div class="modal-overlay" id="generate-modal">
        <div class="modal-card">
            <div class="modal-title">Générer un nouveau réseau</div>
            <div class="modal-input-group">
                <label for="nombre-sites-input">Nombre de sites (ex: 100 à 1000) :</label>
                <input type="number" id="nombre-sites-input" value="120" min="10" max="2000">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn-cancel" onclick="closeModal()">Annuler</button>
                <button class="modal-btn-submit" onclick="submitGeneration()">Générer</button>
            </div>
        </div>
    </div>

    <!-- Scripts JS -->
    <script src="/static/js/graphRender.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/algorithms.js"></script>
</body>
</html>
