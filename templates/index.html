<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Leaflet CSS & JS (Remplace Vis.js) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        /* S'assurer que le container de carte prend toute la hauteur */
        #network-container {
            width: 100%;
            height: calc(100vh - 110px);
            background: #ffffff;
        }
        .leaflet-container { background: #ffffff; }
        .arrow { background: none; border: none; }
        .arrow div { font-size: 11px; line-height: 12px; text-align: center; text-shadow: 0 0 2px #fff, 0 0 2px #fff; pointer-events: none; }
        .legend { background: rgba(255,255,255,.95); padding: 8px 12px; border-radius: 8px; font-size: 12px; color: #3c4043; box-shadow: 0 1px 4px rgba(0,0,0,.25); line-height: 1.7; }
        .legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 8px; }
    </style>
</head>
<body>

    <nav class="google-nav">
        <a href="/" class="google-nav-brand">
            <span style="color: #4285F4;">N</span><span style="color: #EA4335;">o</span><span style="color: #FBBC05;">v</span><span style="color: #4285F4;">a</span><span style="color: #34A853;">p</span><span style="color: #EA4335;">o</span><span style="color: #FBBC05;">l</span><span style="color: #4285F4;">i</span><span style="color: #34A853;">s</span>
        </a>
        <button class="google-nav-btn" onclick="openModal()">⚙️ Générer un jeu de données</button>
    </nav>

    <div class="main-content">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-text" id="loading-msg">Chargement de la carte...</div>
        </div>

        <div class="graph-toolbar">
            <div class="view-switch">
                <button class="view-btn active" id="btn-routier" onclick="switchView('routier')">🛣️ Réseau Routier</button>
                <button class="view-btn" id="btn-fibre" onclick="switchView('fibre')">🌐 Réseau Fibre Optique</button>
                <button class="view-btn" id="btn-both" onclick="switchView('both')">🗺️ Superposer</button>
            </div>
            <div id="stats-info" style="font-size: 13px; color: #5f6368;">Chargement...</div>
        </div>

        <!-- Emplacement de la carte Leaflet -->
        <div id="network-container"></div>
    </div>

    <div class="modal-overlay" id="generate-modal">
        <div class="modal-card">
            <div class="modal-title">Générer un nouveau réseau</div>
            <div class="modal-input-group">
                <label for="nombre-sites-input">Nombre de sites (ex: 100 à 1000) :</label>
                <input type="number" id="nombre-sites-input" value="120" min="10" max="2000">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn-cancel" onclick="closeModal()">Annuler</button>
                <button class="modal-btn-submit" onclick="submitGeneration()">Générer</button>
            </div>
        </div>
    </div>

    <script>
        let map = null;
        let edgeLayer = null, arrowLayer = null, nodeLayer = null, legendEl = null;
        let sitesData = [], routesData = [], fibreData = [];
        let arrowData = [];
        let currentView = 'routier';

        const STYLES = {
            routier: { base: '#4285F4', label: 'Route' },
            fibre:   { base: '#0b8043', label: 'Fibre' }
        };

        function initMap() {
            // Fond blanc : aucune tuile, on ne voit que le graphe
            map = L.map('network-container', {
                preferCanvas: true, attributionControl: false,
                minZoom: 3, maxZoom: 19, zoomSnap: 0.25
            }).setView([48.8566, 2.3522], 10);

            // Ordre d'empilement : liaisons < flèches < sites
            edgeLayer = L.layerGroup().addTo(map);
            arrowLayer = L.layerGroup().addTo(map);
            nodeLayer = L.layerGroup().addTo(map);

            map.on('zoomend', drawArrows);

            const legend = L.control({ position: 'bottomleft' });
            legend.onAdd = () => { legendEl = L.DomUtil.create('div', 'legend'); return legendEl; };
            legend.addTo(map);
        }

        function setLoadingMessage(msg, isError = false) {
            const el = document.getElementById('loading-msg');
            if (el) { el.innerText = msg; if (isError) el.style.color = '#d93025'; }
        }

        function openModal() { document.getElementById('generate-modal').classList.add('active'); }
        function closeModal() { document.getElementById('generate-modal').classList.remove('active'); }

        async function submitGeneration() {
            const nbSites = document.getElementById('nombre-sites-input').value;
            closeModal();
            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
            setLoadingMessage(`Génération de ${nbSites} sites...`);
            try {
                const response = await fetch(`/api/download/all?nombre_sites=${nbSites}`);
                if (!response.ok) throw new Error("Erreur de génération");
                setTimeout(loadNetworkData, 1000);
            } catch (error) {
                console.error("Erreur:", error);
                setTimeout(() => { window.location.reload(); }, 1500);
            }
        }

        async function loadNetworkData() {
            try {
                const parse = async (url, msg) => {
                    setLoadingMessage(msg);
                    const res = await fetch(url);
                    return Papa.parse(await res.text(), { header: true, dynamicTyping: true, skipEmptyLines: true }).data;
                };
                sitesData = await parse('/api/sites', "Chargement des sites...");
                routesData = await parse('/api/routes', "Chargement des routes...");
                fibreData = await parse('/api/fibre', "Chargement de la fibre...");

                const overlay = document.getElementById('loading-overlay');
                if (overlay) {
                    overlay.style.opacity = '0';
                    setTimeout(() => overlay.style.display = 'none', 300);
                }
                renderGraph(currentView, true);
            } catch (error) {
                console.error("Erreur de chargement:", error);
                setLoadingMessage("Erreur lors de la récupération des CSV.", true);
            }
        }

        // Statut -> apparence d'une liaison
        function edgeStyle(kind, statut) {
            let color = STYLES[kind].base, weight = 3, dash = null, opacity = 0.8;
            if (kind === 'routier') {
                if (statut === 'saturé') { color = '#ea4335'; weight = 4; }
                else if (statut === 'travaux') { color = '#f9ab00'; dash = '6, 6'; }
            } else {
                weight = 2.5;
                if (statut === 'en_maintenance') { color = '#f9ab00'; dash = '6, 6'; }
                else if (statut === 'deploiement') { color = '#9aa0a6'; dash = '2, 6'; }
            }
            return { color, weight, dashArray: dash, opacity };
        }

        function drawEdges(kind, rows, sitesMap) {
            let count = 0;
            rows.forEach(row => {
                const posU = sitesMap.get(row.u), posV = sitesMap.get(row.v);
                if (!posU || !posV) return;
                count++;

                const style = edgeStyle(kind, row.statut);
                // En mode superposé, un léger décalage évite que route et fibre se masquent
                const line = L.polyline([posU, posV], style);

                const km = row.distance_km != null ? `${row.distance_km} km<br>` : '';
                line.bindPopup(kind === 'routier'
                    ? `<b>Route ${row.u} ➔ ${row.v}</b><br>${km}Normal : ${row.temps_normal} min<br>Pointe : ${row.temps_pointe} min<br>Statut : ${row.statut}`
                    : `<b>Fibre ${row.u} ➔ ${row.v}</b><br>${km}Coût : ${row.cost} €<br>Statut : ${row.statut}`);
                line.on('mouseover', () => line.setStyle({ weight: style.weight + 2, opacity: 1 }));
                line.on('mouseout', () => line.setStyle(style));
                edgeLayer.addLayer(line);

                arrowData.push({ from: posU, to: posV, color: style.color });
            });
            return count;
        }

        // Flèche au milieu de chaque liaison (sens u -> v), seulement si lisible
        function drawArrows() {
            arrowLayer.clearLayers();
            if (arrowData.length > 400 && map.getZoom() < 12) return;
            arrowData.forEach(a => {
                const p1 = map.project(a.from, 0), p2 = map.project(a.to, 0);
                const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
                const mid = [(a.from[0] + a.to[0]) / 2, (a.from[1] + a.to[1]) / 2];
                arrowLayer.addLayer(L.marker(mid, {
                    interactive: false,
                    icon: L.divIcon({
                        className: 'arrow', iconSize: [12, 12], iconAnchor: [6, 6],
                        html: `<div style="transform:rotate(${angle}deg);color:${a.color}">▶</div>`
                    })
                }));
            });
        }

        function updateLegend(type) {
            if (!legendEl) return;
            const item = (c, label, dash) =>
                `<div><i style="border-color:${c};${dash ? 'border-top-style:dashed;' : ''}"></i>${label}</div>`;
            let html = '';
            if (type !== 'fibre') html += item('#4285F4', 'Route ouverte') + item('#ea4335', 'Route saturée') + item('#f9ab00', 'Travaux / maintenance', true);
            if (type !== 'routier') html += item('#0b8043', 'Fibre active') + item('#9aa0a6', 'Fibre en déploiement', true);
            legendEl.innerHTML = html + '<div style="color:#80868b">▶ sens de la liaison</div>';
        }

        function renderGraph(type, fit = false) {
            currentView = type;
            edgeLayer.clearLayers();
            nodeLayer.clearLayers();
            arrowData = [];

            const sitesMap = new Map();
            const bounds = [];
            sitesData.forEach(site => {
                const lat = site.latitude ?? site.lat;
                const lon = site.longitude ?? site.lon ?? site.x;
                if (lat == null || lon == null) return;
                sitesMap.set(site.id, [lat, lon]);
                bounds.push([lat, lon]);
            });

            // 1) liaisons d'abord (en dessous), 2) sites ensuite (au-dessus)
            let nbEdges = 0;
            if (type !== 'fibre') nbEdges += drawEdges('routier', routesData, sitesMap);
            if (type !== 'routier') nbEdges += drawEdges('fibre', fibreData, sitesMap);

            const nodeColor = type === 'fibre' ? STYLES.fibre.base : STYLES.routier.base;
            sitesData.forEach(site => {
                const pos = sitesMap.get(site.id);
                if (!pos) return;
                L.circleMarker(pos, {
                    radius: 5, fillColor: nodeColor, color: '#fff', weight: 1.5, fillOpacity: 1
                }).bindPopup(`<b>${site.nom || 'Site ' + site.id}</b><br>${site.type || ''}<br>ID : ${site.id}`)
                  .addTo(nodeLayer);
            });

            drawArrows();
            updateLegend(type);

            // On ne recadre que lors d'un (re)chargement : changer de vue garde le zoom de l'utilisateur
            if (fit && bounds.length > 0) map.fitBounds(bounds, { padding: [30, 30] });

            const stats = document.getElementById('stats-info');
            if (stats) stats.innerText = `${sitesMap.size} sites & ${nbEdges} connexions`;
        }

        function switchView(type) {
            ['routier', 'fibre', 'both'].forEach(t => {
                const btn = document.getElementById(t === 'both' ? 'btn-both' : 'btn-' + t);
                if (btn) btn.classList.toggle('active', t === type);
            });
            renderGraph(type);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            loadNetworkData();
        });
    </script>
</body>
</html>
