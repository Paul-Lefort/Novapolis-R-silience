{# Menu « intervention » (icône de la sidebar) #}
<section id="tab-intervention" class="sidebar-tab-content" hidden>
    <div class="sidebar-section">
        <h3>Itinéraires de secours</h3>
        <p class="hint">Choisissez la caserne de départ dans la liste et cliquez sur la carte pour définir le site d'intervention.</p>

        <div class="panel">
            <div class="panel-title">Sommets de l'intervention</div>
            <label class="field-label" for="inter-start-select">Caserne de départ :</label>
            <select id="inter-start-select" class="sidebar-select" data-change="caserne-changed">
                <option value="">Chargement des casernes...</option>
            </select>
            <div class="text-sm mt-sm">Site cible (clic carte) : <span id="inter-target" class="target-value">Aucun</span></div>
        </div>

        <div class="field-group">
            <div class="panel-title">Algorithme et critère</div>
            <label class="field-label" for="inter-algo">Algorithme :</label>
            <select id="inter-algo" class="sidebar-select">
                <option value="dijkstra">Dijkstra (référence, poids ≥ 0)</option>
                <option value="bellman_ford">Bellman-Ford</option>
                <option value="floyd_warshall">Floyd-Warshall</option>
            </select>
            <label class="field-label mt-sm" for="inter-critere">Critère de coût :</label>
            <select id="inter-critere" class="sidebar-select">
                <option value="temps_normal">Durée en circulation normale (min)</option>
                <option value="temps_pointe">Durée en heure de pointe (min)</option>
                <option value="distance">Distance (km)</option>
            </select>
        </div>

        <div class="field-group">
            <div class="panel-title">Scénario de fermeture</div>
            <label class="field-label" for="inter-scenario-file">Importer scenarios.csv :</label>
            <input type="file" id="inter-scenario-file" accept=".csv" class="file-input">

            <label class="field-label" for="inter-manual-arcs">Ou saisir des arcs à fermer (u->v) :</label>
            <input type="text" id="inter-manual-arcs" class="sidebar-input" placeholder="Ex: 3->16, 8->10">
        </div>

        <div class="stack">
            <button class="btn btn-lg btn-block btn-blue" data-action="run-intervention">Calculer le trajet d'intervention</button>
            <button class="btn btn-block btn-gray" data-action="compare-algos">Comparer les algorithmes sur ce trajet</button>
        </div>
        <div id="intervention-results" class="results"></div>
        <div id="compare-results" class="results"></div>
    </div>
</section>
